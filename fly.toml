# Fly.io - best free option here: it does NOT scale to zero by default,
# so the upstream feed stays connected and stats stay warm.
app = "live-threat-map"
primary_region = "sin"   # Singapore - closest to Johor

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # keep the SSE feed alive
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1     # one upstream connection only

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
